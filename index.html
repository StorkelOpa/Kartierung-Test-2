<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kartierung Baumschulenweg – Aneignung im öffentlichen Raum</title>
    <meta name="description"
        content="Digitale Kartierung von Stickern, Graffiti und Aushängen in Berlin-Baumschulenweg, erhoben mit QField im Dezember 2024.">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <div id="map" aria-label="Karte der Kartierung"></div>

    <aside id="panel" class="panel" aria-label="Legende und Auswertung">
        <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body">
            <span class="panel-toggle-label">Legende &amp; Auswertung</span>
            <span class="panel-toggle-icon" aria-hidden="true">−</span>
        </button>

        <div id="panel-body" class="panel-body">
            <header class="panel-header">
                <span class="kicker">Kartierung · Dezember 2024</span>
                <h1>Aneignung im öffentlichen Raum</h1>
                <p class="lead">
                    <span id="total-count">50</span> Spuren von Stickern, Graffiti und Aushängen rund um den
                    S-Bahnhof Baumschulenweg – erhoben per Smartphone mit QField.
                </p>
            </header>

            <div class="tabs" role="tablist">
                <button type="button" role="tab" class="tab active" aria-selected="true" data-tab="legend">Legende &amp;
                    Filter</button>
                <button type="button" role="tab" class="tab" aria-selected="false"
                    data-tab="stats">Auswertung</button>
            </div>

            <section id="tab-legend" class="tab-panel" role="tabpanel"></section>
            <section id="tab-stats" class="tab-panel" role="tabpanel" hidden></section>
        </div>
    </aside>

    <div id="chart-tooltip" class="chart-tooltip" role="status" hidden></div>

    <script src="js/leaflet.js"></script>
    <script src="js/leaflet-svg-shape-markers.min.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="data/StickerundGraffiti_1.js"></script>
    <script src="data/Aushnge_2.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
